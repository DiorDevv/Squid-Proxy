# Example nginx reverse-proxy config for a bare-metal (non-Docker) deployment.
#
# - Serves the built frontend (frontend/dist) as static files.
# - Proxies /api/* and /ws/* to the backend (uvicorn, typically on 127.0.0.1:8000
#   behind the systemd unit in ../systemd/squid-dashboard-backend.service).
# - Terminates SSL. Replace the cert paths with your own (e.g. certbot/Let's Encrypt).
#
# Install: copy to /etc/nginx/sites-available/squid-dashboard.conf, symlink into
# sites-enabled, adjust paths below, then `nginx -t && systemctl reload nginx`.

upstream squid_dashboard_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name dashboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/squid-dashboard/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Security headers appropriate for an internal security-ops tool.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Only set here, not in the Docker-image nginx config -- this server
    # block terminates TLS itself, so it's the one place that can honestly
    # promise "this origin is HTTPS-only" to the browser. Long max-age plus
    # includeSubDomains/preload since this is a fresh addition, not something
    # already relied on with a shorter rollout window.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # style-src needs 'unsafe-inline': Radix's positioning primitives
    # (popovers, tooltips, selects -- used throughout this UI) set inline
    # `style` attributes at runtime. script-src stays strict -- no inline
    # <script> or event handlers anywhere in the built app (confirmed against
    # index.html), so no equivalent relaxation needed there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    # Vite fingerprints every JS/CSS/font filename with a content hash on
    # every build, so a long, immutable cache is safe: a changed file is a
    # new URL, never a stale cache hit.
    location ~* \.(?:js|css|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://squid_dashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://squid_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WebSocket connections are long-lived; the default proxy timeout
        # would otherwise silently drop /ws/live after ~60s of idle.
        proxy_read_timeout 3600s;
    }
}
