name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: health
    attributes:
      label: "GET /api/health output (if related to log ingestion/parsing)"
      description: >
        Especially useful for anything involving log parsing, multi-branch ingestion, or the
        aggregator — this endpoint is designed to surface exactly those failure modes.
      render: json

  - type: input
    id: deployment
    attributes:
      label: Deployment method
      placeholder: "Docker Compose / systemd+nginx / local dev"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "git rev-parse HEAD, or the release tag"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs backend` or the systemd journal, redacted of anything sensitive."
      render: shell
