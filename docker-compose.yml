# The default json-file log driver has no size cap of its own -- without
# this, a long-running container's logs grow unbounded and can quietly fill
# the disk. 10m x 5 files = 50MB max per container, rotated automatically.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
  logging: *default-logging
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://squid:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env before starting}@postgres:5432/squid_dashboard
    LOG_FILE_PATH: /data/squid-logs/access.log
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env before starting}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env before starting}
    CORS_ORIGINS: '["http://localhost:8080"]'
    # Optional -- see "Error tracking" in .env.example. Empty/unset stays inert.
    SENTRY_DSN: ${SENTRY_DSN:-}
    # Optional -- see "UT1 bulk domain blacklist" in backend/.env.example.
    # Off unless UT1_ENABLED=true is set in .env.
    UT1_ENABLED: ${UT1_ENABLED:-false}
    UT1_DATA_DIR: /app/ut1_blacklist_data
    LOG_TAILER_STATE_DIR: /app/log_tailer_state
    # Optional -- capacity tuning for large deployments (defaults match
    # Settings' own demo-scale defaults, so unset stays a no-op). See
    # "Capacity planning for large deployments" in README.md.
    RING_BUFFER_MAX_EVENTS: ${RING_BUFFER_MAX_EVENTS:-500000}
    AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  volumes:
    - squid_log_data:/data/squid-logs
    - archive_data:/app/archives
    - ut1_blacklist_data:/app/ut1_blacklist_data
    - log_tailer_state:/app/log_tailer_state
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: squid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env before starting}
      POSTGRES_DB: squid_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squid -d squid_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      # On both DB networks so backend and db-backup can each reach it --
      # but backend and db-backup are never on the same network as each
      # other (see below), so postgres being reachable from both doesn't
      # bridge them together; Docker doesn't relay traffic between a
      # container's separate networks.
      - backend_db_net
      - backup_db_net
    restart: unless-stopped

  backend:
    <<: *backend-common
    # Overrides the image's own safe-by-default CMD (see Dockerfile) with
    # this deployment's actual trust boundary: only frontend_net's static
    # IP (assigned to the frontend/nginx container below) is trusted to set
    # X-Forwarded-For. Network segmentation (this service is on
    # frontend_net + backend_db_net only -- never backup_db_net, which
    # db-backup and demo-log-generator have no path to at all) is the
    # primary control; this narrows the header-trust precondition to match
    # it exactly, rather than leaving it wide open as a second, independent
    # way the same mistake could reappear later.
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
        "--proxy-headers", "--forwarded-allow-ips=172.28.10.10",
      ]
    ports:
      # Loopback-only, for host-level debugging (e.g. curl'ing /api/health
      # directly) -- not part of the trust boundary above, since a
      # connection arriving this way never presents frontend_net's static
      # IP and so can't spoof X-Forwarded-For regardless.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # ?strict=true: 503 (not 200) when the log tailer is down or events are
      # being dropped, so this actually catches something -- the plain
      # /api/health the frontend polls stays always-200 (see health.py's
      # docstring for why those need to behave differently).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health?strict=true')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net
      - backend_db_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      frontend_net:
        # Fixed so backend's --forwarded-allow-ips above can trust an exact
        # address rather than a whole subnet -- Compose would otherwise
        # assign this dynamically, and could reassign it across a
        # recreate.
        ipv4_address: 172.28.10.10
    depends_on:
      - backend
    restart: unless-stopped

  # Full-database backup (users, alert settings, aggregates, audit log --
  # everything, not just raw_events -- see backend/scripts/backup_database.py's
  # docstring for why that's a distinct concern from archiving). Based on
  # postgres:16-alpine specifically (not the Python backend image) so pg_dump
  # is guaranteed to match the server's exact version.
  db-backup:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: squid
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env before starting}
      PGDATABASE: squid_dashboard
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db_backup_data:/backups
      - ./backend/scripts/backup_postgres_docker.sh:/backup_postgres_docker.sh:ro
    entrypoint: ["/bin/sh", "/backup_postgres_docker.sh"]
    networks:
      # Deliberately *not* on backend_db_net or frontend_net -- this
      # container only ever needs to reach postgres, and has no business
      # being able to reach backend at all. Sharing a network with backend
      # here (even though it's only postgres this needs) would silently
      # reopen the same X-Forwarded-For spoofing path this whole network
      # layout exists to close, since anything on the same Docker network
      # can reach any other member's exposed ports.
      - backup_db_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: generates synthetic Squid access.log traffic so the dashboard
  # can be exercised end-to-end without a real Squid deployment.
  #   docker compose --profile demo up
  demo-log-generator:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    profiles: ["demo"]
    logging: *default-logging
    volumes:
      - squid_log_data:/data/squid-logs
    command:
      [
        "python", "scripts/generate_demo_log.py",
        "--output", "/data/squid-logs/access.log",
        "--rate", "30",
      ]
    # Only ever writes to the shared volume above -- no network calls of
    # any kind, so it gets none: no path to backend (or anywhere else) to
    # spoof from, and one less container's dependencies to keep patched.
    network_mode: "none"
    restart: unless-stopped

networks:
  # Static subnet so frontend's address (below) is fixed across recreates --
  # backend's --forwarded-allow-ips trusts that exact IP, not a whole range.
  frontend_net:
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # backend <-> postgres only. Never shared with backup_db_net's members
  # (db-backup) or frontend_net's (frontend) beyond postgres itself, which
  # sits on both DB networks without bridging them -- see postgres's own
  # networks: comment above.
  backend_db_net:
  # db-backup <-> postgres only.
  backup_db_net:

volumes:
  postgres_data:
  squid_log_data:
  archive_data:
  db_backup_data:
  ut1_blacklist_data:
  log_tailer_state:
