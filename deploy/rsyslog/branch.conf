# Example rsyslog config for a BRANCH server (where Squid itself runs).
#
# Ships this branch's access.log to the central server that runs the
# dashboard backend, over TLS, in real time. If the central server or the
# network link is down, lines queue to local disk (see the `queue.*`
# settings below) and drain automatically once the link is back -- nothing
# is lost, it just arrives late. Pair this with check-queue-disk.sh so a
# multi-day outage can't silently fill the disk.
#
# Install (repeat per branch, changing only the two placeholders marked
# below -- BRANCH_TAG and CENTRAL_HOST):
#
#   sudo cp deploy/rsyslog/branch.conf /etc/rsyslog.d/60-squid-forward.conf
#   # edit BRANCH_TAG and CENTRAL_HOST in the copy
#   # copy this branch's client cert/key + the shared CA cert into place
#   # (generate your own private CA -- see README.md's "Multi-branch
#   # deployment" section; this repo does not ship real certs/keys)
#   sudo systemctl restart rsyslog
#
# Requires Squid's access_log directive to use the "squid" native logformat
# (see README.md's "Required Squid configuration") -- this file only
# transports whatever Squid already writes, unchanged.

module(load="imfile" mode="inotify")

# --- Placeholders: change these two per branch ---
# BRANCH_TAG: a short, unique, filesystem-safe identifier for this branch,
#   e.g. "squid-tashkent". Must match one entry's "branch" (without the
#   "squid-" prefix) in the backend's LOG_SOURCES config -- see
#   backend/.env.example.
# CENTRAL_HOST: the backend server's hostname/IP.
global(
  workDirectory="/var/spool/rsyslog"
)

input(
  type="imfile"
  File="/var/log/squid/access.log"
  Tag="squid-BRANCH_TAG:"
  Severity="info"
  Facility="local1"
  PersistStateInterval="200"
)

# TLS client config -- point at this branch's own cert/key and the shared
# CA cert used to sign both ends. Generate these out-of-band; never commit
# real certs/keys to a repo.
global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/certs/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/certs/branch.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/certs/branch-key.pem"
)

if $syslogtag startswith "squid-BRANCH_TAG:" then {
  action(
    type="omfwd"
    target="CENTRAL_HOST"
    port="6514"
    protocol="tcp"
    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="central.example.internal"

    # Disk-assisted queue: buffers to /var/spool/rsyslog while the central
    # server/network is unreachable, retries forever, and caps growth so an
    # extended outage fills at most ~2GB rather than the whole disk. Tune
    # maxdiskspace to your branch server's actual free space; pair with
    # check-queue-disk.sh to get alerted well before it fills.
    queue.type="linkedlist"
    queue.filename="squid_fwd_BRANCH_TAG"
    queue.maxdiskspace="2g"
    queue.saveOnShutdown="on"
    queue.spoolDirectory="/var/spool/rsyslog"
    action.resumeRetryCount="-1"
    action.resumeInterval="10"
  )
  stop
}
