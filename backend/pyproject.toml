[project]
name = "squid-dashboard-backend"
version = "0.1.0"
description = "Real-time log analytics backend for Squid Proxy"
requires-python = ">=3.11"
license = "MIT"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.139,<0.140",
    # Pinned explicitly (not just left to fastapi's own >=0.46.0 floor) because
    # several starlette CVEs postdate 0.46.2 and pip won't upgrade an
    # already-satisfying transitive dep on its own -- see PYSEC-2026-161/248/
    # 249/1941/1942/2280/2281, all fixed by 1.3.1.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.20,<0.21",
    "asyncpg>=0.30,<0.32",
    "alembic>=1.14,<1.15",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    # Capped below 4.1: passlib 1.7.4 (unmaintained upstream, no newer release
    # exists) probes `bcrypt.__about__.__version__` to detect the backend
    # version, an attribute bcrypt itself removed in 4.1.0. Above that, every
    # startup logs a spurious (harmless but alarming) traceback. Verified
    # this pin is what stops it -- see the docker-compose dry run.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.17",
    "slowapi>=0.1.9,<0.2",
    # xlsx export (write-only Workbook, see services/export_service.py) --
    # 3.1+ for the write-only mode memory fixes needed to keep a
    # multi-million-row export bounded.
    "openpyxl>=3.1,<4",
    "websockets>=13.1,<14",
    "httpx>=0.27,<0.29",
    "sentry-sdk[fastapi]>=2.18,<3",
    # /metrics endpoint (see app/api/routes/metrics.py) -- no heavy
    # transitive deps, just the client-library primitives (Gauge,
    # generate_latest) for exposing already-tracked state in Prometheus
    # text format.
    "prometheus-client>=0.21,<0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.7,<0.8",
    "aiosqlite>=0.20,<0.21",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
