# Example rsyslog config for the CENTRAL server (where the dashboard
# backend runs).
#
# Receives Squid access.log lines forwarded by each branch (see
# branch.conf) over TLS and writes each branch's stream back out to its own
# local file, byte-identical to what Squid wrote on that branch -- so the
# backend's LogTailer (which only reads local files) can tail it exactly
# like a local Squid install. No log re-formatting happens here; the
# `template` below emits only the original message, no syslog envelope.
#
# Install:
#
#   sudo cp deploy/rsyslog/central.conf /etc/rsyslog.d/60-squid-receive.conf
#   # copy the central server's cert/key + the shared CA cert into place
#   sudo mkdir -p /var/log/squid
#   sudo cp deploy/rsyslog/squid-branches.logrotate /etc/logrotate.d/squid-branches
#   sudo systemctl restart rsyslog
#
# Then point the backend's LOG_SOURCES at the resulting files, one entry
# per branch -- see backend/.env.example. After wiring each branch, check
# GET /api/health's `log_sources` array: each branch's parse_failure_rate
# should be at/near 0 (see README.md's "Multi-branch deployment" section).

# --- Placeholder: edit this list ---
# One entry per branch, exactly matching the CN/SAN on that branch's TLS
# client cert (the one it presents via DefaultNetstreamDriverCertFile in
# its own branch.conf). A branch whose cert name isn't in this list will
# fail the TLS handshake -- it'll show up as connection errors in this
# server's rsyslog log, not as a branch "silently missing" from the
# dashboard, but the fix here is to get the list right up front instead of
# debugging it after rollout.
module(load="imtcp"
  StreamDriver.Name="gtls"
  StreamDriver.Mode="1"
  StreamDriver.AuthMode="x509/name"
  StreamDriver.PermittedPeer=["branch-tashkent.example.internal",
                              "branch-samarqand.example.internal",
                              "branch-buxoro.example.internal",
                              "branch-andijon.example.internal"]
)

global(
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/certs/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/certs/central.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/certs/central-key.pem"
)

input(type="imtcp" port="6514")

# Emits just the original Squid log line -- no timestamp/host/tag prefix --
# so the file this writes is exactly the "squid" native logformat the
# backend's log_parser.py expects.
template(name="squidRawLine" type="string" string="%msg%\n")

# Splits back into one file per branch based on the tag each branch set in
# its own branch.conf ("squid-<branch>:") -- $programname is rsyslog's
# parsed form of that tag with the trailing colon stripped.
template(name="squidBranchFile" type="string" string="/var/log/squid/%programname:7:$%.log")

if $programname startswith "squid-" then {
  # fileCreateMode 0644 so the backend process (a different user/group than
  # rsyslog -- see deploy/systemd's User=squid-dashboard) can read these
  # files. If your rsyslog build's default umask already yields 0644 this is
  # a no-op; if not, this is what actually grants the read access LogTailer
  # needs. (Alternatively: add the backend's user to rsyslog's group.)
  action(type="omfile" DynaFile="squidBranchFile" template="squidRawLine" fileCreateMode="0644")
  stop
}

# Rotate the per-branch files above -- see squid-branches.logrotate in this
# same directory (copytruncate mode; required because rsyslog's DynaFile
# keeps the destination file open).
