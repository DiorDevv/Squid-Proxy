# Nginx config baked into the frontend Docker image. Serves the built SPA
# and proxies /api + /ws to the backend container over the Docker network.
# For a bare-metal deployment with SSL termination, see deploy/nginx/ instead.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Security headers appropriate for an internal security-ops tool.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # No Strict-Transport-Security here (unlike deploy/nginx/squid-dashboard.conf) --
    # this server block serves plain HTTP and doesn't terminate TLS itself
    # (see this file's header comment); HSTS belongs on whichever layer
    # actually promises "this origin is HTTPS-only", which isn't this one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    # Vite fingerprints every JS/CSS/font filename with a content hash on
    # every build, so a long, immutable cache is safe: a changed file is a
    # new URL, never a stale cache hit.
    location ~* \.(?:js|css|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html (and the SPA fallback below) must never be cached the way
    # the fingerprinted assets above are -- it's the one file that names
    # *this build's* JS/CSS hashes, so a stale cached copy keeps pointing a
    # returning browser at chunk URLs a newer deploy already deleted (seen
    # live: a rebuilt frontend image left an open tab's cached index.html
    # referencing a since-removed SettingsPage-*.js, and React Router's
    # lazy import threw "Failed to fetch dynamically imported module" on
    # every subsequent client-side navigation until a hard refresh).
    # "no-cache" (despite the name) still allows a cheap conditional
    # revalidation via ETag/Last-Modified -- it just can never be served
    # stale without checking back with nginx first.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
