name: CI

# Runs exactly the commands README.md's "Tests & linting" section already
# documents as the local workflow -- this enforces that, rather than
# inventing separate CI-only gates that could drift from what a contributor
# actually runs locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    # Runs the Playwright smoke suite against the real, wired-together app
    # (frontend/playwright.config.ts) -- previously only ever run by hand, so
    # a regression in the login/dashboard/panel-boundary golden paths could
    # land on main unnoticed between manual checks.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./e2e_test.db"
          JWT_SECRET: "e2e-ci-secret-not-for-production"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "admin12345"
          # A path CI can actually write to -- the log tailer handles a
          # not-yet-existing file the same way it handles Squid not having
          # started yet, so this never needs to exist.
          LOG_FILE_PATH: "/tmp/e2e-access.log"
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 30s:"
          cat /tmp/backend.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        working-directory: frontend
        # E2E_ADMIN_EMAIL/PASSWORD default to the same admin@example.com /
        # admin12345 the backend was just bootstrapped with above (see
        # e2e/global-setup.ts and e2e/smoke.spec.ts), so no override needed.
        run: npm run test:e2e
